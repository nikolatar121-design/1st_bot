<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор палитры темы</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            margin: 0; padding: 20px; text-align: center;
        }
        h3 { margin-bottom: 20px; }
        .section {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px; border-radius: 12px; margin-bottom: 20px;
        }
        .count-btn {
            background: #e4e4e7; border: none; padding: 10px 20px;
            margin: 5px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .count-btn.active {
            background: var(--tg-theme-button-color, #3498db);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        .color-pickers {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .picker-row {
            display: flex; align-items: center; gap: 10px; font-size: 16px;
        }
        input[type="color"] {
            border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
        }
        #save-btn {
            width: 100%; background: var(--tg-theme-button-color, #3498db);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold;
            margin-top: 10px; cursor: pointer;
        }
    </style>
</head>
<body>

    <h3>🎨 Настройка цветов сообщения</h3>

    <div class="section">
        <p>Количество цветов в градиенте:</p>
        <button class="count-btn active" onclick="setCount(1)">1</button>
        <button class="count-btn" onclick="setCount(2)">2</button>
        <button class="count-btn" onclick="setCount(3)">3</button>
        <button class="count-btn" onclick="setCount(4)">4</button>
    </div>

    <div class="section">
        <p>Выберите оттенки:</p>
        <div class="color-pickers" id="pickers-container">
            <!-- Сюда JS будет добавлять кругляши выбора цвета -->
        </div>
    </div>

    <button id="save-btn" onclick="sendDataToBot()">✨ Подтвердить палитру</button>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        let currentCount = 1;
        // Дефолтные красивые цвета для старта
        let defaultColors = ["#3498db", "#8e44ad", "#e74c3c", "#f1c40f"];

        function renderPickers() {
            const container = document.getElementById('pickers-container');
            container.innerHTML = '';
            for (let i = 0; i < currentCount; i++) {
                container.innerHTML += `
                    <div class="picker-row">
                        <label>Цвет ${i+1}:</label>
                        <input type="color" id="color-${i}" value="${defaultColors[i]}">
                    </div>
                `;
            }
        }

        function setCount(count) {
            currentCount = count;
            document.querySelectorAll('.count-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === count);
            });
            renderPickers();
        }

        function sendDataToBot() {
            let selectedColors = [];
            for (let i = 0; i < currentCount; i++) {
                selectedColors.push(document.getElementById(`color-${i}`).value);
            }
            // Отправляем массив цветов боту в виде строки, разделенной запятыми
            tg.sendData(selectedColors.join(','));
        }

        // Первичный рендер при открытии страницы
        renderPickers();
    </script>
</body>
</html>
